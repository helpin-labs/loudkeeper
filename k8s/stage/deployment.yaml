apiVersion: apps/v1
kind: Deployment
metadata:
  name: loudkeeper
  namespace: loudkeeper
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app: loudkeeper
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: loudkeeper
  template:
    metadata:
      labels:
        app: loudkeeper
        env: stage
    spec:
      nodeSelector:
        node.hetzner.com/type: cloud
      initContainers:
        - name: wait-for-data-services
          image: busybox:1.37.0
          command:
            - sh
            - -ec
            - |
              until nc -z loudkeeper-postgres-rw 5432; do sleep 2; done
              until nc -z redis 6379; do sleep 2; done
              until nc -z rabbitmq 5672; do sleep 2; done
              until wget -qO- http://clickhouse:8123/ping | grep -q Ok; do sleep 2; done
      containers:
        - name: web
          image: ghcr.io/helpin-labs/loudkeeper
          envFrom:
            - secretRef:
                name: loudkeeper-secrets
            - configMapRef:
                name: loudkeeper-config
          env:
            - name: RUN_MIGRATIONS
              value: "true"
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: loudkeeper-postgres-app
                  key: password
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 3Gi
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            failureThreshold: 3

        - name: queue
          image: ghcr.io/helpin-labs/loudkeeper
          args: ["queue"]
          envFrom:
            - secretRef:
                name: loudkeeper-secrets
            - configMapRef:
                name: loudkeeper-config
          env:
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: loudkeeper-postgres-app
                  key: password
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 2Gi
          startupProbe:
            exec:
              command: ["sh", "-c", "find /tmp/laudspeaker-healthcheck-queue -mmin -1 | grep -q ."]
            periodSeconds: 5
            failureThreshold: 120
          livenessProbe:
            exec:
              command: ["sh", "-c", "find /tmp/laudspeaker-healthcheck-queue -mmin -1 | grep -q ."]
            periodSeconds: 20
            failureThreshold: 3

        - name: cron
          image: ghcr.io/helpin-labs/loudkeeper
          args: ["cron"]
          envFrom:
            - secretRef:
                name: loudkeeper-secrets
            - configMapRef:
                name: loudkeeper-config
          env:
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: loudkeeper-postgres-app
                  key: password
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 2Gi
          startupProbe:
            exec:
              command: ["sh", "-c", "find /tmp/laudspeaker-healthcheck-cron -mmin -1 | grep -q ."]
            periodSeconds: 5
            failureThreshold: 120
          livenessProbe:
            exec:
              command: ["sh", "-c", "find /tmp/laudspeaker-healthcheck-cron -mmin -1 | grep -q ."]
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: loudkeeper
  namespace: loudkeeper
spec:
  selector:
    app: loudkeeper
  ports:
    - name: http
      port: 8080
      targetPort: http
