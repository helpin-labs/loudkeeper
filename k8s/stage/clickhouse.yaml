apiVersion: clickhouse.altinity.com/v1
kind: ClickHouseInstallation
metadata:
  name: loudkeeper
  namespace: loudkeeper
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  defaults:
    templates:
      podTemplate: clickhouse
      dataVolumeClaimTemplate: clickhouse-data
  configuration:
    files:
      config.d/rabbitmq.xml: |
        <clickhouse>
          <rabbitmq>
            <username from_env="RABBITMQ_USERNAME"/>
            <password from_env="RABBITMQ_PASSWORD"/>
          </rabbitmq>
        </clickhouse>
    profiles:
      default/allow_experimental_json_type: 1
      default/date_time_input_format: best_effort
    users:
      loudkeeper/k8s_secret_password: loudkeeper-secrets/CLICKHOUSE_PASSWORD
      loudkeeper/networks/ip: "::/0"
      loudkeeper/profile: default
      loudkeeper/grants/query:
        - GRANT ALL ON *.*
    clusters:
      - name: main
        layout:
          shardsCount: 1
          replicasCount: 1
  templates:
    podTemplates:
      - name: clickhouse
        spec:
          nodeSelector:
            node.hetzner.com/type: cloud
          securityContext:
            fsGroup: 101
          containers:
            - name: clickhouse
              image: clickhouse/clickhouse-server:26.3.17.110@sha256:2ef11bbe2e44ab7022f37ff3019b3f2125ed09e919ea6194660be6130b7ca4b7
              env:
                - name: RABBITMQ_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: loudkeeper-secrets
                      key: RABBITMQ_USERNAME
                - name: RABBITMQ_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: loudkeeper-secrets
                      key: RABBITMQ_PASSWORD
              resources:
                requests:
                  cpu: 250m
                  memory: 1Gi
                limits:
                  cpu: "1"
                  memory: 2Gi
              volumeMounts:
                - name: clickhouse-data
                  mountPath: /var/lib/clickhouse
    volumeClaimTemplates:
      - name: clickhouse-data
        reclaimPolicy: Retain
        spec:
          accessModes:
            - ReadWriteOnce
          storageClassName: hcloud-volumes-retain
          resources:
            requests:
              storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  namespace: loudkeeper
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  selector:
    clickhouse.altinity.com/chi: loudkeeper
    clickhouse.altinity.com/cluster: main
  ports:
    - name: http
      port: 8123
      targetPort: 8123
    - name: native
      port: 9000
      targetPort: 9000
