apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-config
  namespace: loudkeeper
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  enabled_plugins: |
    [rabbitmq_management,rabbitmq_prometheus].
  rabbitmq.conf: |
    listeners.tcp.default = 5672
    management.tcp.port = 15672
    prometheus.tcp.port = 15692

    default_queue_type = quorum
    queue_leader_locator = balanced
    cluster_partition_handling = pause_minority

    cluster_formation.peer_discovery_backend = classic_config
    # A stable seed lets OrderedReady bootstrap rabbitmq-0 before creating the
    # remaining replicas. Persisted nodes retain their cluster membership.
    cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq-0.rabbitmq-headless.loudkeeper.svc.cluster.local

    vm_memory_high_watermark.absolute = 700MiB
    disk_free_limit.absolute = 1GB
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-headless
  namespace: loudkeeper
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: rabbitmq
  ports:
    - name: amqp
      port: 5672
    - name: epmd
      port: 4369
    - name: distribution
      port: 25672
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: loudkeeper
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  selector:
    app.kubernetes.io/name: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: amqp
    - name: management
      port: 15672
      targetPort: management
    - name: metrics
      port: 15692
      targetPort: metrics
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: rabbitmq
  namespace: loudkeeper
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: loudkeeper
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  serviceName: rabbitmq-headless
  replicas: 3
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rabbitmq
        app.kubernetes.io/part-of: loudkeeper
    spec:
      terminationGracePeriodSeconds: 120
      nodeSelector:
        node.hetzner.com/type: cloud
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: rabbitmq
              topologyKey: kubernetes.io/hostname
      containers:
        - name: rabbitmq
          image: rabbitmq:4.3.6-management@sha256:cdf40d8cb363d145e377ed88d59696a42386ffe54b30125f10eb128b862eea95
          imagePullPolicy: IfNotPresent
          command:
            - bash
            - -ec
          args:
            - |
              export RABBITMQ_NODENAME="rabbit@$(hostname).rabbitmq-headless.loudkeeper.svc.cluster.local"
              exec docker-entrypoint.sh rabbitmq-server
          env:
            - name: RABBITMQ_USE_LONGNAME
              value: "true"
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: loudkeeper-secrets
                  key: RABBITMQ_USERNAME
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: loudkeeper-secrets
                  key: RABBITMQ_PASSWORD
            - name: RABBITMQ_ERLANG_COOKIE
              valueFrom:
                secretKeyRef:
                  name: loudkeeper-secrets
                  key: RABBITMQ_ERLANG_COOKIE
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
            - name: metrics
              containerPort: 15692
            - name: epmd
              containerPort: 4369
            - name: distribution
              containerPort: 25672
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "check_running"]
            timeoutSeconds: 10
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "check_running"]
            timeoutSeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            timeoutSeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /etc/rabbitmq/rabbitmq.conf
              subPath: rabbitmq.conf
              readOnly: true
            - name: config
              mountPath: /etc/rabbitmq/enabled_plugins
              subPath: enabled_plugins
              readOnly: true
            - name: data
              mountPath: /var/lib/rabbitmq
      volumes:
        - name: config
          configMap:
            name: rabbitmq-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: hcloud-volumes-retain
        resources:
          requests:
            storage: 5Gi
