name: Release

on:
  push:
    branches:
      - main
      - staging
    paths-ignore:
      - "**.md"
  release:
    types: [published]

permissions:
  contents: write
  packages: write

concurrency:
  group: loudkeeper-release-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/helpin-labs/loudkeeper

jobs:
  metadata:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - name: Checkout source and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}

      - name: Resolve and validate release
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" = release ]]; then
            TAG=$RELEASE_TAG
            PRERELEASE=$RELEASE_PRERELEASE
          elif [[ "$BRANCH" = staging ]]; then
            OUT=$(scripts/resolve-rc-version.sh)
            TAG=$(sed -n 's/^tag=//p' <<< "$OUT")
            PRERELEASE=true
          else
            OUT=$(scripts/resolve-release-version.sh)
            TAG=$(sed -n 's/^tag=//p' <<< "$OUT")
            PRERELEASE=false
          fi

          if [[ -z "$TAG" ]]; then
            echo "This commit already has the appropriate release tag; skipping."
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$PRERELEASE" = true ]]; then
            [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-rc\.(0|[1-9][0-9]*)$ ]]
          else
            [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

  build:
    name: Build image
    needs: metadata
    if: needs.metadata.outputs.tag != ''
    uses: ./.github/workflows/build.yml
    with:
      dockerfile: Dockerfile
      output: loudkeeper
      external_url: loudkeeper.stage.helpin.ai

  test:
    name: Test image
    needs: [metadata, build]
    uses: ./.github/workflows/test.yml
    with:
      image: loudkeeper

  publish:
    name: Publish image
    runs-on: ubuntu-latest
    needs: [metadata, test]
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish versioned image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: EXTERNAL_URL=loudkeeper.stage.helpin.ai
          tags: |
            ${{ env.IMAGE }}:${{ needs.metadata.outputs.tag }}
            ${{ needs.metadata.outputs.prerelease == 'true' && format('{0}:stage-latest', env.IMAGE) || format('{0}:latest', env.IMAGE) }}

  create-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: [metadata, publish]
    if: github.event_name == 'push'
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.metadata.outputs.tag }}
          PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
        run: |
          ARGS=(--repo "$GH_REPO" --target "$GITHUB_SHA" --title "Loudkeeper $TAG" --generate-notes)
          if [[ "$PRERELEASE" = true ]]; then
            ARGS+=(--prerelease)
          fi
          gh release create "$TAG" "${ARGS[@]}"

  deploy-staging:
    name: Update Kubernetes staging
    runs-on: ubuntu-latest
    needs: [metadata, publish, create-release]
    if: >-
      always() &&
      needs.metadata.outputs.prerelease == 'true' &&
      needs.publish.result == 'success' &&
      (needs.create-release.result == 'success' || needs.create-release.result == 'skipped')
    steps:
      - name: Checkout staging manifests
        uses: actions/checkout@v4
        with:
          repository: usermaven/kubernetes-manifests-staging
          ref: main
          token: ${{ secrets.CI_PAT }}
          path: manifests

      - name: Update image and push manifest
        env:
          TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          FILE=manifests/loudkeeper/deployment.yaml
          sed -i "s|ghcr.io/helpin-labs/loudkeeper:[^[:space:]]*|${IMAGE}:${TAG}|g" "$FILE"
          git -C manifests config user.name "github-actions[bot]"
          git -C manifests config user.email "github-actions[bot]@users.noreply.github.com"
          git -C manifests add loudkeeper/deployment.yaml
          if git -C manifests diff --cached --quiet; then
            echo "Staging already uses $TAG"
            exit 0
          fi
          git -C manifests commit -m "chore: deploy loudkeeper $TAG to staging"
          for attempt in 1 2 3 4 5; do
            if git -C manifests pull --rebase origin main && git -C manifests push origin HEAD:main; then
              exit 0
            fi
            git -C manifests rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "Could not update the staging manifest" >&2
          exit 1
