name: Release

on:
  push:
    branches:
      - staging
    paths-ignore:
      - "**.md"
      - "k8s/**"

permissions:
  contents: write
  packages: write

concurrency:
  group: loudkeeper-staging-release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/helpin-labs/loudkeeper

jobs:
  metadata:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Checkout source and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Resolve and validate release
        id: release
        run: |
          OUT=$(scripts/resolve-rc-version.sh)
          TAG=$(sed -n 's/^tag=//p' <<< "$OUT")

          if [[ -z "$TAG" ]]; then
            echo "This commit already has the appropriate release tag; skipping."
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-rc\.(0|[1-9][0-9]*)$ ]]

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    name: Build image
    runs-on: ubuntu-latest
    needs: metadata
    if: needs.metadata.outputs.tag != ''
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push candidate image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            EXTERNAL_URL=app.loudkeeper.ai
            SENTRY_RELEASE=${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/helpin-labs/loudkeeper
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=loudkeeper
          cache-to: type=gha,mode=max,scope=loudkeeper

  promote:
    name: Promote image
    runs-on: ubuntu-latest
    needs: [metadata, build]
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag built digest
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
          TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:$TAG" \
            --tag "$IMAGE:stage-latest" \
            "$IMAGE@$DIGEST"

  create-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: [metadata, promote]
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --repo "$GH_REPO" \
            --target "$GITHUB_SHA" \
            --title "Loudkeeper $TAG" \
            --generate-notes \
            --prerelease

  deploy-staging:
    name: Update Kubernetes staging
    runs-on: ubuntu-latest
    needs: [metadata, promote, create-release]
    if: >-
      always() &&
      needs.metadata.outputs.tag != '' &&
      needs.promote.result == 'success' &&
      needs.create-release.result == 'success'
    steps:
      - name: Checkout staging manifests
        uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          path: deploy

      - name: Pin the published RC in the Kustomization
        env:
          TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          FILE=deploy/k8s/stage/kustomization.yaml
          sed -i "s|newTag: .*|newTag: ${TAG}|" "$FILE"
          git -C deploy config user.name "github-actions[bot]"
          git -C deploy config user.email "github-actions[bot]@users.noreply.github.com"
          git -C deploy add k8s/stage/kustomization.yaml
          if git -C deploy diff --cached --quiet; then
            echo "Staging already uses $TAG"
            exit 0
          fi
          git -C deploy commit -m "chore: deploy loudkeeper $TAG to staging [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git -C deploy pull --rebase origin staging && git -C deploy push origin HEAD:staging; then
              exit 0
            fi
            git -C deploy rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "Could not update the staging manifest" >&2
          exit 1
