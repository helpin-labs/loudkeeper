name: Trigger staging deploy
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of ghcr.io/helpin-labs/loudkeeper image to deploy
        required: true
        type: string
      env:
        description: Laudspeaker environment
        required: true
        type: choice
        options:
          - "staging"
          - "prod"
jobs:
  deploy-staging:
    name: Redeploy staging
    uses: ./.github/workflows/deploy.yml
    with:
      image-repository: ghcr.io/helpin-labs/loudkeeper
      image-tag: ${{ inputs.tag }}
      env: ${{ inputs.env }}
    secrets: inherit
