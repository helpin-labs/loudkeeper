name: Pull request
on:
  pull_request:
    branches:
      - staging
      - production
jobs:
  build-pr:
    name: Build docker image
    uses: ./.github/workflows/build.yml
    with:
      dockerfile: Dockerfile
      output: laudspeaker
      external_url: app-staging.laudspeaker.com
  test-pr:
    needs: [build-pr]
    name: Test docker image
    uses: ./.github/workflows/test.yml
    with:
      image: laudspeaker
