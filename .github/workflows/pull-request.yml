name: Pull request
on:
  pull_request:
    branches:
      - staging
      - production

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test-pr:
    name: Test source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install server dependencies
        run: npm install --workspace packages/server --legacy-peer-deps --no-audit --no-fund --package-lock=false

      - name: Run server unit tests
        run: npm run test:server -- cache.service.spec

      - name: Test release version resolver
        run: bash scripts/release-version.test.sh
