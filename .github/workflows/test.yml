name: Test
on:
  workflow_call:
    inputs:
      image:
        description: Local image name or remote image reference to test
        required: true
        type: string
      load_artifact:
        description: Download and load an image tar artifact before testing
        default: true
        required: false
        type: boolean
jobs:
  test:
    name: Test docker image
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Download artifact
      if: inputs.load_artifact
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.image }}
        path: /tmp
    - name: Load image
      if: inputs.load_artifact
      run: |
        docker load --input /tmp/${{ inputs.image }}.tar
    - name: Setup node
      uses: actions/setup-node@v4
      with:
        node-version: 16
    - name: Setup environment
      run: |
        export LAUDSPEAKER_IMAGE="${{ inputs.image }}"
        set +e
        docker compose --profile testing up -d --quiet-pull 2>&1 | tee /tmp/compose-up.log
        compose_status=${PIPESTATUS[0]}
        set -e

        if (( compose_status != 0 )); then
          compose_error=$(tail -n 10 /tmp/compose-up.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
          echo "::error title=Docker Compose startup failed::$compose_error"
          docker compose --profile testing ps --all || true
          docker compose --profile testing logs --tail=100 || true
          exit "$compose_status"
        fi

        curl --fail --silent --show-error --output /dev/null --retry 30 --retry-delay 2 --retry-connrefused http://localhost:8080
    - name: Install unit test dependencies
      run: "npm install -w packages/server          \n"
    - name: Run unit tests
      # TODO: Existing unit tests need their dependencies mocked. Append fixed spec files as arguments to test:server
      run: |
        npm run test:server -- cache.service.spec
    - name: Install cypress dependencies
      run: |
        npm install -w packages/tests
    - name: Run cypress tests
      run: |
        TESTS_BASE_URL=http://localhost:8080 TESTS_API_BASE_URL=http://localhost:8080/api TESTS_INTERNAL_API_BASE_URL=http://laudspeaker-web:8080/api npm run tests:run 
    - name: Docker logs
      run: docker compose --profile testing logs --tail=100 || true
      if: always()
    - name: Publish Test Report
      uses: mikepenz/action-junit-report@v4
      if: always()
      with:
        report_paths: ./packages/tests/cypress/test-results/*.xml
        detailed_summary: true
    - name: Upload Test Report
      uses: actions/upload-artifact@v4
      if: always() # always run even if the previous step fails
      with:
        name: junit-test-results
        path: ./packages/tests/cypress/test-results/*.xml
        compression-level: 0
    - name: Upload Test Screen Recordings
      uses: actions/upload-artifact@v4
      if: always() # always run even if the previous step fails
      with:
        name: cypress-videos
        path: ./packages/tests/cypress/videos/*
        compression-level: 0
