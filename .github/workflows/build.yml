name: Build
on:
  workflow_call:
    inputs:
      dockerfile:
        description: Path to the dockerfile to be built
        default: Dockerfile
        required: true
        type: string # dockerfile name (likely Dockerfile, Dockerfile.prod.client, Dockerfile.prod.client)
      output:
        description: Name of the docker image that will be saved as an artifact
        default: laudspeaker
        required: true
        type: string # dockerfile name (likely Dockerfile, Dockerfile.prod.client, Dockerfile.prod.client)
      external_url:
        default: app.laudspeaker.com
        required: true
        type: string
      publish:
        description: Publish the image to GHCR after exporting it for tests
        default: false
        type: boolean
      tags:
        description: Newline-separated GHCR tags used when publishing
        default: ""
        type: string
jobs:
  build:
    name: Build laudspeaker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: inputs.publish
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and export
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          tags: ${{ inputs.output }}
          outputs: type=docker,dest=/tmp/${{ inputs.output }}.tar
          build-args: |
            EXTERNAL_URL=${{ inputs.external_url }}
      - name: Build and publish
        if: inputs.publish
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          tags: ${{ inputs.tags }}
          push: true
          build-args: |
            EXTERNAL_URL=${{ inputs.external_url }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.output }}
          path: /tmp/${{ inputs.output }}.tar
          compression-level: 0
